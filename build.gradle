plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.oleynik.qa.workshop'
version = '2.0-SNAPSHOT'
description = 'TestNG 7 workshop examples'

def versions = [
        testng  : '7.12.0',
        openCsv : '5.12.0',
        assertJ : '3.27.7',
        hamcrest: '3.0',
        lombok  : '1.18.48',
        slf4j   : '2.0.18'
]

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.testng:testng:${versions.testng}"
    implementation "com.opencsv:opencsv:${versions.openCsv}"
    implementation "org.slf4j:slf4j-api:${versions.slf4j}"

    compileOnly "org.projectlombok:lombok:${versions.lombok}"
    annotationProcessor "org.projectlombok:lombok:${versions.lombok}"
    testCompileOnly "org.projectlombok:lombok:${versions.lombok}"
    testAnnotationProcessor "org.projectlombok:lombok:${versions.lombok}"

    testImplementation "org.assertj:assertj-core:${versions.assertJ}"
    testImplementation "org.hamcrest:hamcrest:${versions.hamcrest}"
    testImplementation "org.slf4j:slf4j-simple:${versions.slf4j}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        workshop(MavenPublication) {
            from components.java
        }
    }
}

def requestedGroups = { String propertyName ->
    providers.gradleProperty(propertyName).orElse('').get()
            .split(',').collect { it.trim() }.findAll { !it.isEmpty() }
}

tasks.withType(Test).configureEach {
    // TestNG manages thread concurrency inside this single Gradle test worker JVM.
    maxParallelForks = 1
    useTestNG {
        includeGroups.addAll(requestedGroups('includeGroups'))
        excludeGroups.addAll(requestedGroups('excludeGroups'))
    }
    systemProperty 'file.encoding', 'UTF-8'

    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = true
    }
    reports {
        junitXml.required = true
        html.required = true
    }
}

test {
    useTestNG {
        parallel = 'methods'
        threadCount = 3
    }
}

tasks.register('suiteTest', Test) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Runs the TestNG XML suite selected with -Psuite=path/to/suite.xml.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    def suitePath = providers.gradleProperty('suite').orElse('').get().trim()
    def suiteFile = suitePath ? file(suitePath) : null
    inputs.property('suite', suitePath)

    // XML owns parallelism, thread count, order, listeners, and test selection.
    // In particular, do not inherit test's methods/3 settings here.
    useTestNG {
        if (suiteFile != null) {
            suites suiteFile
        }
    }
    doFirst {
        if (suiteFile == null) {
            throw new GradleException('Select a TestNG XML file with -Psuite=src/test/resources/testngsuites.xml')
        }
        if (!suiteFile.isFile()) {
            throw new GradleException("TestNG suite file does not exist or is not a regular file: ${suiteFile}")
        }
    }
}
